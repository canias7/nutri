name: Deploy to Cloudflare

# Reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued push should replace a pending one rather than
# race it to the same Worker.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build before linting, and do not run tsc separately. Next.js generates
      # the route types (PageProps, LayoutProps) during the build, so on a fresh
      # checkout anything type-aware fails first with "Cannot find name" until
      # they exist. `next build` type-checks as it goes and fails on errors, so
      # a separate tsc pass would only add a way to get the order wrong.
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gezrztmxyxbtbbasvbix.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7cNwGYry3xq_-zboLS8RTQ_IVLHRiA6

      - run: npm run lint

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
